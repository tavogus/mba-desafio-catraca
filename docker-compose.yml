name: catraca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - catraca-pg:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      PORT: "3000"
      COOKIE_SECRET: dev-cookie-secret-catraca
      # 1 é o modo do avaliador. Os gates sobrescrevem com 0.
      GATEWAY_DELAY_FACTOR: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./vitest.config.ts:/app/vitest.config.ts
      - ./README.md:/app/README.md
      - ./AGENTS.md:/app/AGENTS.md
      - ./CLAUDE.md:/app/CLAUDE.md
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  catraca-pg:
